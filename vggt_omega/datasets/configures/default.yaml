defaults:
  - default_dataset.yaml

data:
  train:
    dataset:
      _target_: vggt_omega.datasets.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: vggt_omega.datasets.sequence_dataset.SequenceDataset
          sequence_cls: {_target_: hydra.utils.get_class, path: vggt_omega.datasets.vendors.tum.TumSequence}
          split: train
          # Machine-specific path — override for your environment.
          data_root: /jfs/guibiao/streamVGGT/data/eval/tum
          sequences: ["*"]
          min_num_images: 24
          sequence_kwargs: {assoc_max_diff: 0.02, depth_scale: 5000.0, intrinsics: null}
